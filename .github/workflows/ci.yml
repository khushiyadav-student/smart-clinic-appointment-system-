name: Smart Clinic CI Pipeline

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main

jobs:
  build-and-check:
    name: Build and Validate Flask App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Python Syntax
        run: python -m compileall -q app.py

      - name: Verify Dependencies
        run: pip check

      - name: CI Pipeline Completed
        run: echo "Smart Clinic CI Pipeline completed successfully!"