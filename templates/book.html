{% extends 'base.html' %}{% block title %}Book Appointment{% endblock %}{% block content %}
<div class="auth"><div><span class="eyebrow">APPOINTMENT REQUEST</span><h1>Book with {{ doctor.name }}</h1><p>{{ doctor.specialization }} · Consultation fee ₹{{ '%.0f'|format(doctor.fees) }}</p></div>
<form class="panel form" method="POST"><label>Appointment date</label><input type="date" name="appointment_date" min="{{ '' }}" required><label>Appointment time</label><input type="time" name="appointment_time" required><label>Reason for visit</label><textarea name="reason" rows="3" placeholder="Briefly describe your concern"></textarea><button class="btn">Submit appointment request</button></form></div>{% endblock %}
